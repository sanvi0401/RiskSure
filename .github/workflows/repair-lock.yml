name: Repair frontend lockfile

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  repair:
    if: hashFiles('.lock-repair-needed') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .lock-repair-needed
          if git diff --cached --quiet; then
            exit 0
          fi
          git rm .lock-repair-needed
          git commit -m "fix: regenerate frontend lockfile after dependency merges"
          git push
