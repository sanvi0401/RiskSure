# Keep in sync with backend/requirements.txt (Vercel may read either file).
[project]
name = "risksure"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Flask==3.1.3",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-JWT-Extended==4.7.4",
  "Flask-Migrate==4.1.0",
  "Flask-Cors==6.0.5",
  "Flask-Limiter==4.1.1",
  "alembic==1.16.5",
  "pyotp==2.10.0",
  "cryptography==50.0.1",
  "requests==2.34.2",
  "neo4j==6.3.1",
  "python-dotenv==1.1.1",
  "gunicorn==26.2.0",
  "psycopg[binary]==3.2.10",
  "xgboost-cpu==3.0.5; sys_platform == \"linux\"",
  "xgboost==3.0.5; sys_platform != \"linux\"",
  "numpy>=2.0,<3",
  "joblib==1.5.2",
  "redis==6.4.0"
]
